name: Platform validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# The test job only needs permission to read the repository content under test.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      # Full history lets Gitleaks detect a credential that was committed and
      # later removed, rather than checking only the latest file snapshot.
      - name: Check out complete Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git history for exposed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep findings in the redacted job summary instead of publishing a
          # report artifact or PR comment that could expose sensitive context.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  test:
    name: Platform tests (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: fraud_platform_test
          POSTGRES_USER: fraud_test_user
          POSTGRES_PASSWORD: local-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraud_test_user -d fraud_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: fraud_platform_test
      POSTGRES_USER: fraud_test_user
      POSTGRES_PASSWORD: local-ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      RUN_POSTGRES_TESTS: "1"
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      KAFKA_TRANSACTION_TOPIC: paysim.transactions.v1
      RUN_KAFKA_TESTS: "1"
      # Compose validates Airflow-only variables while parsing, even though this job
      # starts Kafka only. These values are unused CI placeholders, not credentials.
      AIRFLOW_DB_PASSWORD: local-ci-only-unused-airflow-database-password
      AIRFLOW_ADMIN_PASSWORD: local-ci-only-unused-airflow-admin-password
      AIRFLOW_API_JWT_SECRET: local-ci-only-unused-airflow-jwt-secret-with-at-least-sixty-four-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate complete Docker Compose configuration
        run: docker compose --profile airflow --profile api config --quiet

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Cache downloaded packages using requirements.txt as the cache key input.
          cache: pip
          cache-dependency-path: requirements.txt

      # The RAG embedding library needs PyTorch, but CI does not use a GPU.
      # Installing the CPU wheel first prevents pip from downloading the much
      # larger CUDA dependency set and exhausting the hosted runner's disk.
      - name: Install CPU-only PyTorch
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          "torch>=2.2,<3.0"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Start Apache Kafka
        run: docker compose up --detach --wait kafka

      - name: Create the PaySim Kafka topic
        run: docker compose run --rm kafka-init

      - name: Initialize PostgreSQL schema
        run: >-
          psql --set ON_ERROR_STOP=1 --host localhost --username fraud_test_user
          --dbname fraud_platform_test --file database/init/001_create_raw_transactions.sql
        env:
          PGPASSWORD: local-ci-only-password

      - name: Initialize Kafka ingestion audit schema
        run: >-
          psql --set ON_ERROR_STOP=1 --host localhost --username fraud_test_user
          --dbname fraud_platform_test --file database/init/002_create_transaction_ingestions.sql
        env:
          PGPASSWORD: local-ci-only-password

      # Compilation checks every dbt model, test, macro, source reference and
      # YAML definition without running the 6.3-million-row PaySim workload.
      - name: Validate dbt connection and project configuration
        run: dbt debug --project-dir dbt --profiles-dir dbt

      - name: Compile dbt models and tests
        run: dbt compile --project-dir dbt --profiles-dir dbt

      - name: Run complete Python and service integration test suite
        run: python -m pytest

      - name: Show Kafka logs after a failure
        if: failure()
        run: docker compose logs kafka
