name: Python tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# The test job only needs permission to read the repository content under test.
permissions:
  contents: read

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Cache downloaded packages using requirements.txt as the cache key input.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest
